name: NetworkX OOB Testing

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx pytest pytest-cov

    - name: Run Functional Tests with Reporting
      run: |
        # Generujemy raport JUnit XML (wymóg nauczyciela)
        pytest tests/shortest_path_finder.py --junitxml=report.xml

    - name: Run Performance Tests
      run: |
        python tests/test_load_networkx.py << 'EOF'
        1
        EOF

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          report.xml
          tests/results.csv
